name: elonezet

on:
  push:
    branches: [main]
    paths: ["docs/*.html", "docs/*.css", "docs/*.js", "tools/elonezet.py", ".github/workflows/elonezet.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kepek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          (cd docs && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          python tools/elonezet.py
      - name: Képek az elonezet ágra
        run: |
          cd elonezet
          git init -q -b elonezet
          git config user.name "sorjaban-bot"
          git config user.email "sorjaban-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Előnézet ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" elonezet
