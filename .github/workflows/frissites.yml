name: napi-frissites

# A napi frissítés szünetel (2026. november 18.). Kézzel indítható: Actions → napi-frissites → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frissites
  cancel-in-progress: false

jobs:
  frissites:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u pipeline/fetch.py 2>&1 | tee pipeline/utolso_futas.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Adatok visszaírása
        if: always()
        run: |
          git config user.name "sorjaban-bot"
          git config user.email "sorjaban-bot@users.noreply.github.com"
          git add docs/data pipeline/utolso_futas.log
          git commit -m "Katalógus frissítés $(date -u +%Y-%m-%d) [skip ci]" || echo "nincs változás"
          git pull --rebase -q
          git push
